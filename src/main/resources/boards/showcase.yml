              position: "24 20"
              size: "397 54"
              alignment: left
              text: "<gradient:#F43F5E:#FB7185><b>WEB IMAGE GALLERY\n& SKINS</b></gradient>"
              font-size: 22

            nav-desc:
              type: text
              position: "24 80"
              size: "397 105"
              alignment: left
              text: "<gray>Test real asynchronous remote web images\nloaded securely with anti-SSRF filters from\nMinotar and external web hosts.</gray>"
              font-size: 16

            switch-btn:
              type: button
              position: "24 200"
              size: "397 125"
              color: "#E11D48"
              corner-radius: 6
              outline-color: "#BE123C"
              outline-width: 2
              on-hover-color: "#F43F5E"
              on-hover-outline-color: "#FFFFFF"
              hover-glow: true
              hover-glow-color: "#FB7185"

              children:
                btn-lbl:
                  type: pixel_text
                  position: "0 0"
                  size: "100% 100%"
                  alignment: center
                  vertical-alignment: center
                  font-size: 24
                  shadow: true
                  text: "&f&lVIEW GALLERY (SCENE 2) &a&l»"

              on-hover:
                hover-snd:
                  type: play_sound
                  sound: "ui.button.click"
                  pitch: 1.5

              on-click:
                switch:
                  type: switch_scene
                  scene: "gallery"
                ding:
                  type: play_sound
                  sound: "entity.player.levelup"
                  pitch: 1.5

        shop-card:
          type: background
          position: "495 20"
          size: "445 355"
          color: "#0f172a"
          corner-radius: 4

          children:
            shop-title:
              type: text
              position: "24 20"
              size: "397 54"
              alignment: left
              text: "<gradient:#38BDF8:#10B981><b>INTERACTIVE RANKS\n/ SHOP</b></gradient>"
              font-size: 22

            shop-desc:
              type: text
              position: "24 80"
              size: "397 105"
              alignment: left
              text: "<gray>Interactive shop banner with item icons,\nrank purchases, hover outlines, and direct\nclick actions.</gray>"
              font-size: 16

            shop-btn:
              type: button
              position: "24 200"
              size: "397 125"
              color: "#0284C7"
              corner-radius: 6
              outline-color: "#0369A1"
              outline-width: 2
              on-hover-color: "#0EA5E9"
              on-hover-outline-color: "#FFFFFF"
              hover-glow: true
              hover-glow-color: "#38BDF8"

              children:
                btn-lbl:
                  type: pixel_text
                  position: "0 0"
                  size: "100% 100%"
                  alignment: center
                  vertical-alignment: center
                  font-size: 24
                  shadow: true
                  text: "&f&lOPEN RANKS (SCENE 3) &e&l»"

              on-hover:
                hover-snd:
                  type: play_sound
                  sound: "ui.button.click"
                  pitch: 1.5

              on-click:
                switch:
                  type: switch_scene
                  scene: "ranks"
                ding:
                  type: play_sound
                  sound: "entity.player.levelup"
                  pitch: 1.5

  # ----------------------------------------------------------------------------
  # SCENE 2: Real Remote Web Images & Security
  # ----------------------------------------------------------------------------
