          position: "24 44"
          font-size: 18
          text: "&7Mouse scroll wheel or view cards"

        scroll-container:
          type: scroll_pane
          position: "20 72"
          size: "424 345"
          scroll-inner-size: "424 640"
          mouse-scroll: true
          mouse-scroll-vertical: true
          mouse-scroll-amount: 40
          scroll-behavior: snap

          content:
            item-1:
              type: background
              position: "0 0"
              size: "420 90"
              color: "#334155"
              corner-radius: 4
              children:
                title:
                  type: pixel_text
                  position: "16 16"
                  font-size: 20
                  shadow: true
                  text: "&aFeature 1: Zero-Copy Netty"
                desc:
                  type: pixel_text
                  position: "16 48"
                  font-size: 16
                  text: "&7Direct pooled channel memory buffers"

            item-2:
              type: background
              position: "0 105"
              size: "420 90"
              color: "#334155"
              corner-radius: 4
              children:
                title:
                  type: pixel_text
                  position: "16 16"
                  font-size: 20
                  shadow: true
                  text: "&bFeature 2: Dirty Diffs"
                desc:
                  type: pixel_text
                  position: "16 48"
                  font-size: 16
                  text: "&7Sub-rectangle delta tile compression"

            item-3:
              type: background
              position: "0 210"
              size: "420 90"
              color: "#334155"
              corner-radius: 4
              children:
                title:
                  type: pixel_text
                  position: "16 16"
                  font-size: 20
                  shadow: true
                  text: "&eFeature 3: Folia Raycasting"
                desc:
                  type: pixel_text
                  position: "16 48"
                  font-size: 16
                  text: "&7Per-viewer crosshair look tracking"

            item-4:
              type: background
              position: "0 315"
              size: "420 90"
              color: "#334155"
              corner-radius: 4
              children:
                title:
                  type: pixel_text
                  position: "16 16"
                  font-size: 20
                  shadow: true
                  text: "&dFeature 4: Hover Reactions"
                desc:
                  type: pixel_text
                  position: "16 48"
                  font-size: 16
                  text: "&7Glow blooms, color shifts, image swap"

            item-5:
              type: background
              position: "0 420"
              size: "420 90"
              color: "#334155"
              corner-radius: 4
              children:
                title:
                  type: pixel_text
                  position: "16 16"
                  font-size: 20
                  shadow: true
                  text: "&cFeature 5: Anti-SSRF Security"
                desc:
                  type: pixel_text
                  position: "16 48"
                  font-size: 16
                  text: "&7Hardened DNS & IP private firewalls"

            item-6:
              type: background
              position: "0 525"
              size: "420 90"
              color: "#334155"
              corner-radius: 4
              children:
                title:
                  type: pixel_text
                  position: "16 16"
                  font-size: 20
                  shadow: true
                  text: "&6Feature 6: Multi-Scene Transitions"
                desc:
                  type: pixel_text
                  position: "16 48"
                  font-size: 16
