# ==============================================================================
# GoosBoards - 8x8 Interactive Showcase Board (1024x1024 Pixels)
# Tests and showcases all features of GoosBoards:
#  1. Virtual Item Frame Netty packet engine with 20 TPS dirty diffs
#  2. Per-viewer crosshair raycasting and dynamic hover tracking
#  3. Crisp board outline on aim (hover-glow: true, glow-mode: border)
#  4. Dynamic button hover colors (on-hover-color, on-hover-outline-color)
#  5. Soft bloom glow effects on buttons (hover-glow: true, hover-glow-color)
#  6. Dynamic hover image swapping (image + hover-image)
#  7. 2D Player Head avatars with skin outer hat layers (%player_name%)
#  8. Placeholders: %player_name%, %player_ping%, Vault economy, PAPI
#  9. MiniMessage gradients (<gradient:#HEX:#HEX><b>...</b></gradient>)
# 10. Scalable pixel text with shadows (font-size, font-scale, shadow: true)
# 11. Auto-font-size text fitting to bounds
# 12. Interactive mouse-wheel scroll panes (scroll_pane, mouse-scroll: true)
# 13. Multi-scene switching (Hub -> Web Gallery -> Ranks/Shop)
# 14. Real asynchronous Anti-SSRF validated remote web images
# 15. In-game audio triggers (ui.button.click, entity.player.levelup, etc.)
# 16. Console commands and player message dispatch
# ==============================================================================

settings:
  dithering: true
  persistent: false
  reset-on-radius-exit: true

displays:
  main:
    world: "world"
    width: 8
    height: 8
    top-left:
      x: 0.0
      y: 80.0
      z: 0.0
    direction: "south"
    distance: 32.0
    interaction-distance: 16.0
    shape: "rounded"
    corner-radius: 32
    glow: false
    glow-color: "red"
    hover-glow: true
    hover-glow-color: "aqua"
    glow-mode: "border"

scenes:

  # ----------------------------------------------------------------------------
  # SCENE 1: Interactive Dashboard Hub
  # ----------------------------------------------------------------------------
  default:

    # 1. Main Slate Background
    background:
      type: background
      position: "0 0"
      size: "100% 100%"
      color: "#0f172a"
      corner-radius: 16

    # 2. Header Brand Logo (Circular container with dynamic outline and hover swap!)
    header-logo-container:
      type: background
      position: "32 32"
      size: "80 80"
      shape: "circle"
      color: "#1e293b"
      outline-color: "#38BDF8"
      outline-width: 2
      on-hover-outline-color: "#00FFCC"
      on-hover-outline-width: 4
      hover-glow: true
      hover-glow-color: "#38BDF8"

      children:
        header-logo:
          type: image
          position: "8 8"
          size: "64 64"
          cache-behavior: global
          image: "https://minotar.net/avatar/MHF_Chest/100.png"
          hover-image: "https://minotar.net/avatar/MHF_Apple/100.png"

    # 3. Header Title with MiniMessage Gradient
    header-title:
      type: text
      position: "128 32"
      size: "860 48"
      alignment: left
      text: "<gradient:#38BDF8:#818CF8><b>GOOSBOARDS 8X8 SHOWCASE</b></gradient>"
      font: "SansSerif"
      font-size: 34
      outline-color: "#000000"
      outline-stroke: 1.5

    # 4. Header Subtitle (Large, crisp pixel text)
    header-subtitle:
      type: pixel_text
      position: "130 84"
      text: "&7Real URLs, 20 FPS GIF, Circular Masking &8| &a1024x1024 px (8x8 tiles)"
      color: "#94a3b8"
      font-size: 20

    # 5. Left Panel: Player Card & Live Interactive Triggers
    player-card:
      type: background
      position: "32 140"
      size: "464 430"
      color: "#1e293b"
      corner-radius: 6
      outline-color: "#475569"
      outline-width: 1

      children:
        avatar-circle:
          type: background
          position: "24 24"
          size: "96 96"
          shape: "circle"
          color: "#0f172a"
          outline-color: "#F59E0B"
          outline-width: 2
          on-hover-outline-color: "#FDE047"
          on-hover-outline-width: 3

          children:
            avatar:
              type: head_2d
              position: "8 8"
              size: "80 80"
              skin: "%player_name%"
              fallback: "steve"

        player-name:
          type: auto_font_size_text
          position: "140 32"
          size: "300 40"
          text: "<gradient:#FBBF24:#F59E0B><b>%player_name%</b></gradient>"

        stats-label:
          type: pixel_text
          position: "140 80"
          font-size: 20
          text: "&eOnline &8| &bPing: &f%player_ping%ms"

        card-divider:
          type: background
          position: "24 136"
          size: "416 2"
          color: "#334155"

        card-desc:
          type: text
          position: "24 148"
          size: "416 65"
          text: "<gray>Real-time virtual item frame map pipeline\npowered by PacketEvents.</gray>"
          font-size: 18

        alert-button:
          type: button
          position: "24 222"
          size: "416 58"
          color: "#2563EB"
          corner-radius: 4
          outline-color: "#1D4ED8"
          outline-width: 2
          on-hover-color: "#3B82F6"
          on-hover-outline-color: "#FFFFFF"
          hover-glow: true
          hover-glow-color: "#60A5FA"

          children:
            btn-label:
              type: pixel_text
              position: "0 0"
              size: "100% 100%"
              alignment: center
              vertical-alignment: center
              font-size: 22
              shadow: true
              text: "&f&lTEST SOUND & ALERT"

          on-hover:
            hover-snd:
              type: play_sound
              sound: "ui.button.click"
              volume: 0.5
              pitch: 1.2

          on-click:
            click-snd:
              type: play_sound
              sound: "entity.player.levelup"
              volume: 1.0
              pitch: 1.0
            alert-msg:
              type: send_message
              formatting: minimessage
              message: "<gradient:#10B981:#06B6D4><b>[GoosBoards]</b> Interactive button clicked by %player_name%!</gradient>"

        cmd-button:
          type: button
          position: "24 290"
          size: "416 58"
          color: "#059669"
          corner-radius: 4
          outline-color: "#047857"
          outline-width: 2
          on-hover-color: "#10B981"
          on-hover-outline-color: "#FFFFFF"
          hover-glow: true
          hover-glow-color: "#34D399"

          children:
            btn-lbl:
              type: pixel_text
              position: "0 0"
              size: "100% 100%"
              alignment: center
              vertical-alignment: center
              font-size: 22
              shadow: true
              text: "&f&lRUN COMMAND (SAY)"

          on-click:
            say-cmd:
              type: command
              execute-from-console: true
              command: "say GoosBoards 8x8 showcase running for %player_name%!"
            ding:
              type: play_sound
              sound: "entity.experience_orb.pickup"

        hover-swap-button:
          type: button
          position: "24 358"
          size: "416 58"
          color: "#7C3AED"
          corner-radius: 4
          outline-color: "#6D28D9"
          outline-width: 2
          on-hover-color: "#8B5CF6"
          on-hover-outline-color: "#FDE047"
          hover-glow: true
          hover-glow-color: "#A78BFA"
          image: "https://minotar.net/avatar/MHF_Chest/100.png"
          hover-image: "https://minotar.net/avatar/MHF_Apple/100.png"

          children:
            swap-lbl:
              type: pixel_text
              position: "0 0"
              size: "100% 100%"
              alignment: center
              vertical-alignment: center
              font-size: 20
              shadow: true
              text: "&e&lHOVER ME: &f&lSWAP IMAGE!"

          on-hover:
            swap-snd:
              type: play_sound
              sound: "ui.button.click"
              volume: 0.6
              pitch: 1.6

    # 6. Right Panel: ScrollPane Showcase
    scroll-panel:
      type: background
      position: "528 140"
      size: "464 430"
      color: "#1e293b"
      corner-radius: 6
      outline-color: "#475569"
      outline-width: 1

      children:
        scroll-title:
          type: pixel_text
          position: "24 16"
          font-size: 22
          shadow: true
          text: "&e&lSCROLLABLE CONTAINER"

        scroll-sub:
