# ==============================================================================
# GoosBoards Engine - Global Configuration
# Target: Paper / Folia 1.20.4+ | Clients: 1.19.4+ (Protocol >= 762)
# ==============================================================================
config-version: 1

# --- PERSISTENCE & DATABASE ---
database:
  # When false, disables database initialization completely (0 DB threads, 0 storage by default).
  # Set to true only if you enable 'persistent: true' on boards or require SQL persistence.
  # Default: false (Zero background DB threads, 0 player storage)
  enabled: false

  # Database type to use when persistence is enabled.
  # Options:
  #   H2       - Embedded file database, zero external setup required
  #   MYSQL    - External MySQL server with HikariCP connection pooling
  #   MARIADB  - External MariaDB server with HikariCP connection pooling
  type: H2

  # Connection configuration for external databases (MYSQL / MARIADB)
  host: "localhost"
  port: 3306
  database: "goosboards"
  username: "root"
  password: ""
  table-prefix: "goosboards_"

  # HikariCP Pool settings
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000

# --- CONCURRENCY & THREAD POOLS (Folia-Safe) ---
threading:
  # Size of the daemon pool executing async look-vector raycasts.
  # Default: 1 (Minimal resource footprint; safe for 50+ concurrent players)
  raycast-pool-size: 1

  # Size of the thread pool handling software rasterization and color quantization.
  # Default: 1 (Eliminates thread contention; keeps CPU usage near 0.00%)
  render-pool-size: 1

# --- PERFORMANCE, CADENCES & LOD TUNABLES ---
performance:
  # Interval in server ticks between render engine ticks (1 = 20 FPS, 2 = 10 FPS).
  # Lower values give smoother animations; higher values reduce CPU cycles.
  render-tick-interval: 1

  # Cadence (in server ticks) for evaluating player crosshair hover raycasts.
  # Set to 1 for instant button hover response, or 2 for ultra-light background checking.
  hover-raycast-interval-ticks: 2

  # Distance Level-of-Detail (LOD) divisors.
  # Controls how often map packets are rendered and transmitted depending on viewer distance.
  lod:
    # Within this distance (in blocks), the near divisor is applied.
    near-distance: 16.0
    # Tick divisor for near viewers (1 = every tick / 20 FPS).
    near-divisor: 1

    # Between near-distance and this distance (in blocks), the medium divisor is applied.
    medium-distance: 16.0
    # Tick divisor for medium viewers (4 = every 4 ticks / 5 FPS).
    medium-divisor: 4

    # Beyond medium distance up to render distance, the far divisor is applied.
    # (20 = every 20 ticks / 1 FPS).
    far-divisor: 20

  # Network burst protection to prevent Netty channel saturation with 10+ viewers.
  network:
    # Maximum map sub-tiles (128x128) sent to a single player within a single server tick.
    # Prevents huge packet spikes while permitting 8x8 boards (up to 64 tiles) to flush in 1 tick.
    max-tiles-per-player-per-tick: 64

    # When true, checks if the player's Netty channel is writable before queuing map packets.
    check-channel-writability: true

# --- SPATIAL INDEXING (Broad-Phase Raycast Gate) ---
spatial-index:
  # Size of spatial buckets in blocks. Players are only raycast against boards
  # occupying their current or adjacent spatial buckets.
  bucket-size: 32

  # Cadence (in server ticks) for refreshing the player-to-board proximity index.
  proximity-scan-interval-ticks: 2

# --- GRAPHICS, QUANTIZATION & NETWORK ---
rendering:
  # Global default for color dithering on map displays.
  # Options:
  #   TILE_ISOLATED - Clamps Floyd-Steinberg error at 128x128 boundaries (Best visual/perf balance)
  #   NONE          - Fastest, nearest-neighbor color quantization (Best for flat/UI designs)
  default-dithering: TILE_ISOLATED

  # Network flush batching. When true, queues all dirty tiles for a board
  # and flushes the Netty channel once per frame instead of per-tile.
  batch-packet-flushes: true

  # Debounce delay (in milliseconds) for PlaceholderAPI-driven redraws (legacy alias for placeholders.debounce-ms).
  placeholder-debounce-ms: 500

# --- PLACEHOLDERS & DYNAMIC TEXT ---
placeholders:
  # Default refresh interval (in server ticks) between PlaceholderAPI evaluations on boards.
  # 20 ticks = 1.0 second (recommended default), 10 ticks = 0.5s, 1 tick = every tick.
  # Can be overridden per-board in board YAML under settings (placeholder-refresh-ticks: 20).
  default-refresh-ticks: 20

  # Minimum debounce delay (in milliseconds) to throttle rapid back-to-back PAPI resolutions per player.
  # Prevents runaway PAPI lookups during quick scene changes, clicks, or burst redraws.
  debounce-ms: 150

# --- ANIMATED GIF TUNING ---
gif:
  # Global upper bound on GIF animation playback rate (in frames per second, 1 to 20).
  # Can be overridden lower per-gif on individual boards (fps: 10, frame-delay-ms: 100).
  max-fps: 20

  # Default playback rate for GIFs that do not specify an FPS override or internal frame delay (in frames per second).
  default-fps: 10

# --- SHARED RENDER CACHE (Viewer Deduplication) ---
render-cache:
  # Maximum memory (in Megabytes) allocated to context-independent rendered tiles.
  max-memory-mb: 128

  # Time-to-idle (in minutes) before inactive cached tiles are evicted from RAM.
  expire-after-access-minutes: 10

# --- PERSISTENT MEDIA CACHE (Player Skins & Web Images) ---
media-cache:
  # Maximum number of player skin files cached on disk before LRU eviction.
  max-cached-skins: 1024

  # Maximum number of remote web images cached on disk before LRU eviction.
  max-cached-images: 256

  # Maximum retention time (in days) before inactive cached media is evicted.
  retention-days: 7

# --- SECURITY, SSRF & RESOURCE BOMBS ---
security:
  media:
    # Maximum allowed download size for remote images/GIFs (in bytes). Default: 8MB
    max-file-size-bytes: 8388608

    # Network timeout for fetching remote assets (in milliseconds).
    connect-timeout-ms: 4000
    read-timeout-ms: 6000

    # Maximum redirect hops allowed when resolving an image URL.
    max-redirects: 3

    # Hard limits on decoded animated GIFs to prevent Out-Of-Memory (OOM) bombs.
    max-gif-frames: 100
    max-gif-resolution: 2048 # Width or height in pixels

  # Anti-SSRF DNS Validator:
  # Rejects remote image requests that resolve to private, loopback, or cloud-metadata IP addresses.
  ssrf-firewall:
    enabled: true
    blocked-ranges:
      - '127.0.0.0/8'       # Loopback IPv4
      - '10.0.0.0/8'        # RFC1918 Class A
      - '172.16.0.0/12'     # RFC1918 Class B
      - '192.168.0.0/16'    # RFC1918 Class C
      - '169.254.0.0/16'    # Link-Local / Cloud Metadata (AWS/GCP/Azure)
      - '0.0.0.0/8'         # Current network
      - '::1/128'           # Loopback IPv6
      - 'fc00::/7'          # Unique Local IPv6
      - 'fe80::/10'         # Link-Local IPv6

# --- EXTERNAL APIS & FALLBACKS (Player Heads / Skins / Metadata) ---
api:
  skin-service:
    # Primary API endpoint for resolving player heads/avatars.
    # Placeholders supported: {uuid}, {username}
    # Examples:
    #   Mojang session: "https://sessionserver.mojang.com/session/minecraft/profile/{uuid}"
    #   Crafatar: "https://crafatar.com/avatars/{uuid}?overlay"
    #   Minotar: "https://minotar.net/avatar/{uuid}"
    #   Custom / Self-hosted proxy: "https://skin.mycoolserver.net/avatar/{uuid}"
    primary-avatar-url: "https://crafatar.com/avatars/{uuid}?overlay"

    # Profile lookup API (resolves username to UUID if needed)
    profile-url: "https://api.mojang.com/users/profiles/minecraft/{username}"

    # Backup / Fallback APIs tried in order when primary encounters HTTP 429 (Too Many Requests), 5xx, or network timeouts.
    fallback-avatar-urls:
      - "https://minotar.net/avatar/{uuid}"
      - "https://mc-heads.net/avatar/{uuid}"

    # Rate limiting & backoff handling
    rate-limit:
      # Maximum requests per minute to external avatar services to avoid rate-limit bans
      max-requests-per-minute: 120
      # Backoff cooldown duration (in seconds) after encountering HTTP 429 before attempting the endpoint again
      rate-limit-backoff-seconds: 60
      # Network request timeout in milliseconds
      timeout-ms: 4000

# --- INTERACTION & ANTI-EXPLOIT ---
interaction:
  # Token-bucket rate limiting per player
  rate-limiting:
    max-clicks-per-second: 4
    max-hover-packets-per-second: 20

  # Economy Guard: Window (in milliseconds) during which duplicate transactions
  # with the same idempotency key are rejected. Prevents click-macro dupes.
  economy-idempotency-window-ms: 1000

  # Sound played automatically when clicking any interactive element (can be overridden per object).
  default-click-sound: "minecraft:ui.button.click"

# --- DEBUG & OBSERVABILITY ---
debug:
  # When enabled, prints exhaustive real-time diagnostic logging to the console:
  # scene parsing, component layouts, player proximity, entity frame rigs, render cycles, dirty tiles, and packets.
  enabled: false

  # Logs render timings, cache hit ratios, and raycast cycle metrics to the console.
  performance-logging: false

  # Highlights component bounding boxes on the board with red outlines (For UI layout testing).
  draw-bounding-boxes: false
